[project]
name = "unrot"
version = "0.1.0"
description = "Terminal-based brain training for analytics engineers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=3.0.0",
    "typer>=0.12.0",
    "duckdb>=1.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
unrot = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
